name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只保留一个部署;不取消进行中的部署,避免发布到一半被打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # enablement: true 首次运行时自动创建 Pages 站点(Source=GitHub Actions)
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated 需要完整 git 历史取每页的最后提交时间
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # vitepress build 内置内部死链检查,坏文档在此失败(PR 上即阻塞 merge)
      - run: npm run docs:build

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  # 仅 push main / 手动触发时发布;PR 只做上面的构建校验
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
